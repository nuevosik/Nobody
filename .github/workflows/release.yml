name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config libssl-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev mesa-vulkan-drivers libasound2-dev libzstd-dev \
            libsqlite3-dev libgit2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: build
        run: cargo build --release --locked
        env:
          CARGO_TERM_COLOR: always

      - name: pack
        run: |
          target=$(rustc -vV | awk '/host:/{print $2}')
          mkdir -p dist
          cp target/release/nobody dist/nobody
          cp install.sh dist/install.sh
          tar -C dist -czf "nobody-${target}.tar.gz" nobody
          sha256sum *.tar.gz > sha256sums.txt
          echo "ASSET=nobody-${target}.tar.gz" >> "$GITHUB_ENV"

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="nobody ${GITHUB_REF_NAME}

          Install:
          \`\`\`sh
          curl -fsSL https://github.com/nuevosik/Nobody/releases/latest/download/install.sh | sh
          \`\`\`
          "
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ASSET" sha256sums.txt dist/install.sh --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "$notes" \
              "$ASSET" \
              sha256sums.txt \
              dist/install.sh
          fi
