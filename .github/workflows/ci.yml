name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config libssl-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev mesa-vulkan-drivers libasound2-dev libzstd-dev \
            libsqlite3-dev libgit2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: "! rg -n 'infrastructure::|crate::(daemon|icons)' src/presentation"
      - run: "! rg -n 'presentation::' src/infrastructure"
      - run: cargo test --all-targets
