[package]
name = "nobody"
version = "0.1.1"
edition = "2024"
description = "Daemon de notificações Wayland baseado em D-Bus"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f42c6e873eee375b94ec8684001a1d6eba8c3a2b", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f42c6e873eee375b94ec8684001a1d6eba8c3a2b", default-features = false, features = ["wayland"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
anyhow = "1.0"
blocking = "1.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
smallvec = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
debug = false
panic = "abort"
